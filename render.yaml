services:
  - type: web
    name: ai-team-brain-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
